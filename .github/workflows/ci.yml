name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # O esqueleto Laravel só existe depois que alguém roda scripts/bootstrap.ps1,
  # e até lá não há composer.json para instalar. Sem esta checagem o CI fica
  # permanentemente vermelho por um motivo esperado — e CI sempre vermelho
  # ensina todo mundo a ignorar o vermelho, inclusive quando ele for real.
  detect:
    name: Detectar projeto PHP
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}

    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          if [ -f composer.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Esqueleto Laravel ainda não existe. Rode scripts/bootstrap.ps1 para gerá-lo; os testes passam a rodar automaticamente a partir daí."
          fi

  test:
    name: Testes e análise estática
    needs: detect
    if: needs.detect.outputs.exists == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, intl
          coverage: xdebug

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependências
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Verificar formatação
        run: vendor/bin/pint --test

      - name: Análise estática
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      # O FakeProvider é o único usado aqui: nenhum teste toca a rede, e
      # Http::preventStrayRequests() no Pest.php garante isso.
      - name: Testes
        env:
          FLIGHT_PROVIDERS: fake
        run: php artisan test --coverage --min=80

  contract:
    name: Contrato OpenAPI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # O contrato precisa ser válido antes de qualquer merge: o repo do
      # frontend gera os tipos dele a partir deste arquivo, e um YAML quebrado
      # só apareceria lá — no repositório errado, com a pessoa errada.
      - name: Validar openapi.yaml
        run: npx -y @redocly/cli@latest lint openapi.yaml --format=stylish
